[package]
name = "padbridge"
version = "0.3.0"
description = "PlayStation and Xbox controllers, with a native Slint UI and per-controller output mode"
edition = "2021"

[lib]
name = "padbridge_lib"
path = "src/lib.rs"

[[bin]]
name = "padbridge"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification", "unstable_ds4"] }
crc32fast = "1"
parking_lot = "0.12"
slint = { version = "1.18", features = ["compat-1-18", "renderer-femtovg-wgpu"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
